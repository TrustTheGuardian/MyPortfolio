<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="lensCore" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F2FFF0" />
      <stop offset="35%" stop-color="#7CFF6B" />
      <stop offset="72%" stop-color="#16FF00" />
      <stop offset="100%" stop-color="#0B6E00" />
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16FF00" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#16FF00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#16FF00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark tactical rounded-square badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#050505" stroke="#16FF00" stroke-opacity="0.55" stroke-width="2.5" />

  <!-- Minimal dark tactical NVG framing & straps -->
  <g stroke="#16FF00" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Side harness straps -->
    <line x1="6" y1="39" x2="12" y2="39" />
    <line x1="52" y1="39" x2="58" y2="39" />
    <!-- Top mount strap -->
    <line x1="32" y1="7" x2="32" y2="14" />
    <!-- Triangular bridge frame connecting all three lenses -->
    <path d="M17 39 L32 22 L47 39 Z" fill="#0D140D" fill-opacity="0.9" />
  </g>

  <!-- Subtle outer neon glow halos -->
  <circle cx="17" cy="39" r="14" fill="url(#lensGlow)" />
  <circle cx="47" cy="39" r="14" fill="url(#lensGlow)" />
  <circle cx="32" cy="22" r="11.5" fill="url(#lensGlow)" />

  <!-- Lens housings (dark metallic bezels) -->
  <circle cx="17" cy="39" r="10.5" fill="#0A120A" stroke="#16FF00" stroke-opacity="0.45" stroke-width="1.5" />
  <circle cx="47" cy="39" r="10.5" fill="#0A120A" stroke="#16FF00" stroke-opacity="0.45" stroke-width="1.5" />
  <circle cx="32" cy="22" r="8.5" fill="#0A120A" stroke="#16FF00" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Glowing triple NVG lenses -->
  <circle cx="17" cy="39" r="8.2" fill="url(#lensCore)" />
  <circle cx="47" cy="39" r="8.2" fill="url(#lensCore)" />
  <circle cx="32" cy="22" r="6.5" fill="url(#lensCore)" />

  <!-- High-contrast bright cores for crisp readability at 16x16 -->
  <circle cx="16.2" cy="38.2" r="2.6" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="46.2" cy="38.2" r="2.6" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="31.4" cy="21.4" r="2.0" fill="#FFFFFF" fill-opacity="0.9" />
</svg>

